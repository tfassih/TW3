<script>/* TW3 domain model. Pure functions; no DOM, network, or runtime dependencies. */
(function (root, factory) {

  const clone = value => JSON.parse(JSON.stringify(value));

  };
  function blank(title = 'Untitled story', medium = 'game', unit = 'beat') {
    const first = {id:uid('e'), title:'The beginning', description:'Where the story starts.', role:'beginning', behavior:'static', begin:0, end:1, x:160, y:260};
    const last = {id:uid('e'), title:'The ending', description:'Where the story concludes.', role:'ending', behavior:'static', begin:10, end:11, x:660, y:260};
    return {format:'tw3', version:1, id:uid('story'), title, medium, unit, description:'', characters:[], events:[first,last], connections:[{id:uid('l'),from:first.id,to:last.id,kind:'static',label:'The story unfolds'}], updatedAt:new Date().toISOString()};
  }
  function preview(s, selections = {}, enabled = false, time = Infinity) {
    const active = new Set();
    if (!enabled || s.medium !== 'game') s.events.forEach(e => active.add(e.id));

      s.events.filter(e => e.behavior === 'static' || e.role === 'beginning').forEach(e => active.add(e.id));
      let changed = true;

        changed = false;
        for (const l of eventLinks(s)) {
          const open = l.kind === 'static' || selections[l.from] === l.id;
          if (active.has(l.from) && open && !active.has(l.to)) { active.add(l.to); changed = true; }
        }
      }
    }
    const selectedActive = id => eventLinks(s).some(l => l.id === id && active.has(l.from) && selections[l.from] === l.id);
    const connectionActive = l => {
      const endpoints = [l.from,l.to].filter(id => isEvent(s,id));
      if (!endpoints.every(id => active.has(id))) return false;
      if (!enabled || l.kind === 'static') return true;
      if (isEvent(s,l.from) && isEvent(s,l.to)) return selections[l.from] === l.id;
      return !l.choiceId || selectedActive(l.choiceId);
    };
    const characters = {};
    s.characters.forEach(c => {
      const enter = s.events.find(e=>e.id===c.entrance.eventId);
      const exit = s.events.find(e=>e.id===c.exit?.eventId);
      const associated = s.connections.filter(l=>(l.from===c.id && isEvent(s,l.to)) || (l.to===c.id && isEvent(s,l.from)));
      const present = !!enter && active.has(enter.id) && associated.some(connectionActive);
      const triggered = enabled ? c.dynamicTraits.filter(t => {
        const e = s.events.find(x=>x.id===t.eventId);
        return e && active.has(e.id) && e.begin <= time && (!t.choiceId || selectedActive(t.choiceId));
      }).sort((a,b)=>(s.events.find(e=>e.id===a.eventId)?.begin||0)-(s.events.find(e=>e.id===b.eventId)?.begin||0)) : [];
      const exits = triggered.filter(t=>t.effect==='exit').map(t=>s.events.find(e=>e.id===t.eventId)?.end).filter(Number.isFinite);

      const state = {};
      triggered.filter(t=>t.effect!=='exit').forEach(t=>state[t.key]=t.value);
      characters[c.id] = {present, begin:enter?.begin??0, end, traits:state, triggered, status: !present?'Absent on this route':time<(enter?.begin??0)?'Not yet encountered':time>=end?'Exited the story':'In the story'};
    });

  }
  function validate(s) {
    const issues = [];

    if (!s.title.trim()) add('error','The story needs a title.');
    if (!s.unit.trim()) add('error','Choose a timeline unit.');
    if (s.characters.length > 500 || s.events.length > 500 || s.connections.length > 3000) add('error','This project exceeds the supported size limits.');

    if (s.medium==='game' && ends.length>1 && ends.some(e=>e.behavior==='static')) add('error','Alternate endings must all be dynamic. Change the existing ending to dynamic before adding another.');
    if (s.medium!=='game' && ends.length!==1) add('error','A linear story needs exactly one ending.');

    if(ids.size!==all.length) add('error','Node identifiers must be unique.');
    const links=eventLinks(s);

      if(!Number.isFinite(e.begin)||!Number.isFinite(e.end)||e.begin<0||e.end<e.begin) add('error',`${label(e)} has an invalid time range.`,e.id);
      if(e.role==='beginning' && e.behavior!=='static') add('error','The beginning must be static.',e.id);
      if(s.medium!=='game' && e.behavior==='dynamic') add('error','Linear stories cannot have dynamic events.',e.id);
      if(e.role==='ending' && links.some(l=>l.from===e.id)) add('error',`${label(e)} is an ending with outgoing event connections.`,e.id);
      if(e.role==='beginning' && links.some(l=>l.to===e.id)) add('error','The beginning cannot have incoming event connections.',e.id);
      if(e.behavior==='dynamic' && !links.some(l=>l.to===e.id)) add('warning',`${label(e)} has no incoming route.`,e.id);
      if(starts[0] && e.begin<starts[0].begin) add('error',`${label(e)} starts before the beginning.`,e.id);
    });
    s.connections.forEach(l=>{
      if(!ids.has(l.from)||!ids.has(l.to)) add('error','A connection points to a missing item.');
      if(l.from===l.to) add('error','An item cannot connect to itself.',l.from);
      if(l.kind==='dynamic' && s.medium!=='game') add('error','Linear stories cannot have dynamic connections.',l.from);
      if(l.kind==='dynamic' && !l.label.trim()) add('error','Dynamic connections need a choice or condition label.',l.from);
      if(l.choiceId && !links.some(x=>x.id===l.choiceId && x.kind==='dynamic')) add('error','A connection references a missing choice.',l.from);
      if(isEvent(s,l.from)&&isEvent(s,l.to)) {
        const a=getNode(s,l.from),b=getNode(s,l.to);
        if(b.begin<a.begin) add('warning',`${label(a)} connects backward in time to ${label(b)}.`,a.id);
        if(l.kind==='dynamic' && b.behavior==='static') add('warning',`${label(b)} is static and will occur regardless of this choice.`,b.id);
      }
    });
    s.characters.forEach(c=>{
      if(c.staticTraits.length>100 || c.dynamicTraits.length>100) add('error',`${label(c)} exceeds the 100 traits per type limit.`,c.id);
      if(!c.justification.trim()) add('error',`${label(c)} needs a justification.`,c.id);
      if(!c.narrative.trim()) add('error',`${label(c)} needs one narrative description.`,c.id);
      if(c.named && !c.name.trim()) add('error','A named character needs a proper name.',c.id);
      if(!c.named && c.importance==='major') add('error','Unnamed characters must be minor.',c.id);
      if(!c.staticTraits.length || c.staticTraits.some(t=>!t.trim())) add('error',`${label(c)} needs at least one static trait.`,c.id);
      const ent=s.events.find(e=>e.id===c.entrance.eventId),ex=s.events.find(e=>e.id===c.exit?.eventId);
      if(!ent || !c.entrance.why.trim() || !c.entrance.how.trim()) add('error',`${label(c)} needs an entrance event, why, and how.`,c.id);
      if(c.exit && (!ex || !c.exit.why.trim() || !c.exit.how.trim())) add('error',`${label(c)} has an incomplete exit.`,c.id);
      if(ex && ent && ex.end<ent.begin) add('error',`${label(c)} exits before entering.`,c.id);
      const linked=s.connections.filter(l=>(l.from===c.id && isEvent(s,l.to))||(l.to===c.id && isEvent(s,l.from)));

      linked.forEach(l=>{const e=getNode(s,l.from===c.id?l.to:l.from); if(ent && (e.end<ent.begin || (ex && e.begin>ex.end))) add('warning',`${label(c)} connects to ${label(e)} outside their lifetime.`,c.id);});
      if(s.medium!=='game' && c.dynamicTraits.length) add('error','Linear stories cannot have dynamic traits.',c.id);
      c.dynamicTraits.forEach(t=>{
        const event=s.events.find(e=>e.id===t.eventId);
        if(!event || !t.key.trim() || !t.value.trim()) add('error',`${label(c)} has an incomplete dynamic trait.`,c.id);
        if(t.choiceId && !links.some(l=>l.id===t.choiceId && l.kind==='dynamic')) add('error',`${label(c)} has a trait tied to a missing choice.`,c.id);
        const choice=links.find(l=>l.id===t.choiceId), choiceEvent=choice&&getNode(s,choice.from);
        if(event && ent && event.begin<ent.begin) add('warning',`${label(c)} has a trait that starts before their entrance.`,c.id);

    });

      while(change) {change=false; links.forEach(l=>{if(reachable.has(l.from)&&!reachable.has(l.to)){reachable.add(l.to);change=true;}});}
      s.events.filter(e=>!reachable.has(e.id)).forEach(e=>add('warning',`${label(e)} is disconnected from the beginning.`,e.id));
      const canEnd=new Set(ends.map(e=>e.id));change=true;
      while(change) {change=false;links.forEach(l=>{if(canEnd.has(l.to)&&!canEnd.has(l.from)){canEnd.add(l.from);change=true;}});}

  }
  function parseProject(text) {
    if(typeof text!=='string'||text.length>40*1024*1024) throw new Error('Project must be a JSON file smaller than 40 MB.');
    let s;try{s=JSON.parse(text);}catch{throw new Error('This file is not valid JSON.');}

    if(!s||s.format!=='tw3'||s.version!==1) fail('unsupported format or version.');

    const num=(v,name)=>{if(typeof v!=='number'||!Number.isFinite(v)||Math.abs(v)>1e7)fail(name+' must be a finite number.');return v;};
    const en=(v,allowed,name)=>{if(!allowed.includes(v))fail('invalid '+name+'.');return v;};
    const arr=(v,name,max=1000)=>{if(!Array.isArray(v)||v.length>max)fail(name+' must be an array within limits.');return v;};
    const moment=v=>({eventId:str(v?.eventId,'event id',100),why:str(v?.why,'entrance/exit reason'),how:str(v?.how,'entrance/exit method')});
    const base=n=>({id:str(n?.id,'id',100),x:num(n?.x,'x'),y:num(n?.y,'y')});
    const out={format:'tw3',version:1,id:str(s.id,'story id',100),title:str(s.title,'title',200),description:str(s.description??'','description'),unit:str(s.unit??'beat','unit',40),medium:en(s.medium,['game','novel','film','tv'],'medium'),updatedAt:str(s.updatedAt??'','updated date',100)};
    out.events=arr(s.events,'events',500).map(e=>({...base(e),title:str(e.title,'event title',200),description:str(e.description,'event description'),role:en(e.role,['beginning','event','ending'],'event role'),behavior:en(e.behavior,['static','dynamic'],'event behavior'),begin:num(e.begin,'begin'),end:num(e.end,'end')}));
    out.characters=arr(s.characters,'characters',500).map(c=>{
      if(typeof c.named!=='boolean')fail('named must be boolean.');
      const portrait=str(c.portrait??'','portrait',1500000);
      if(portrait&&!/^data:image\/(png|jpeg|webp);base64,[a-zA-Z0-9+/=]+$/.test(portrait))fail('portrait must be an embedded PNG, JPEG, or WebP.');
      return {...base(c),named:c.named,name:str(c.name,'name',200),archetype:str(c.archetype??'','archetype',200),importance:en(c.importance,['major','minor'],'importance'),justification:str(c.justification,'justification'),narrative:str(c.narrative,'narrative'),personality:str(c.personality??'','personality'),staticTraits:arr(c.staticTraits,'static traits',100).map(t=>str(t,'trait',2000)),dynamicTraits:arr(c.dynamicTraits??[],'dynamic traits',100).map(t=>({id:str(t.id,'trait id',100),key:str(t.key,'trait key',100),value:str(t.value,'trait value',2000),eventId:str(t.eventId,'trigger event id',100),choiceId:str(t.choiceId??'','choice id',100),effect:en(t.effect??'trait',['trait','exit'],'trait effect'),importance:en(t.importance??'normal',['low','normal','high'],'trait importance')})),entrance:moment(c.entrance),exit:c.exit?moment(c.exit):null,portrait};
    });
    out.connections=arr(s.connections,'connections',3000).map(l=>({id:str(l.id,'connection id',100),from:str(l.from,'source',100),to:str(l.to,'target',100),kind:en(l.kind,['static','dynamic'],'connection kind'),label:str(l.label??'','connection label',500),choiceId:str(l.choiceId??'','choice id',100)}));
    const allIds=[...nodes(out),...out.connections].map(n=>n.id);
    if(new Set(allIds).size!==allIds.length || allIds.some(id=>!id||!/^[-a-zA-Z0-9_]+$/.test(id)))fail('identifiers must be unique and use letters, digits, dashes, or underscores.');

    if(errors.length)fail(errors.slice(0,6).map(i=>i.message).join(' '));
    return out;
  }
  function sample() {
    const s={format:'tw3',version:1,id:'story-bellwether',title:'The Bellwether Archive',medium:'game',unit:'beat',description:'A missing archivist. A city that edits its own history. Three lives caught between the truth and the stories that keep them safe.',updatedAt:new Date().toISOString(),events:[
      {id:'e-start',title:'A letter after midnight',description:'An unsigned letter summons Mara to the shuttered municipal archive. Someone has erased an entire district from the maps.',role:'beginning',behavior:'static',begin:0,end:2,x:120,y:390},
      {id:'e-choice',title:'The price of the truth',description:'Ivo offers the original ledger. The player must decide whether to expose it or protect the people named inside.',role:'event',behavior:'static',begin:5,end:7,x:465,y:390},
      {id:'e-reveal',title:'Open the archive',description:'The ledger is broadcast across the city. Ivo becomes a witness, and the erased district returns to public memory.',role:'ending',behavior:'dynamic',begin:12,end:15,x:840,y:290},

</script><script>/* TW3 application shell. Classic scripts keep file:// operation supported. */
(function(){

function recover(){try{localStorage.setItem(KEY,JSON.stringify(story));recoveryOK=true;}catch{recoveryOK=false;toast('Browser draft storage is full or unavailable. Save a project file now to keep your work.');}status();}

function render(){
 $('#story-title').textContent=story.title;$('#story-meta').textContent=mediumName(story.medium)+' / '+story.unit+' chronology';document.title='TW3 · '+story.title;$('#board-count').textContent=story.characters.length+' characters / '+story.events.length+' events';$('#undo').disabled=!history.length;$('#redo').disabled=!future.length;$('#timeline-unit').textContent=story.unit;$('#playhead').value=time;$('#playhead').max=maxTime();status();renderLibrary();renderRoute();renderBoard();renderTimeline();renderInspector();const issues=C.validate(story);$('#health-button').innerHTML=`<span class="status-dot" style="background:${issues.length?'#be994e':'#6e9180'}"></span> Story checks <span class="health-count">${issues.length||'✓'}</span>`;$('#connect-toggle').classList.toggle('active',connect);$('#connection-hint').hidden=!connect;$('#connection-hint').textContent=connectSource?'Choose the second item · Esc to cancel':'Choose the first item · Esc to cancel';transform();
}
function renderLibrary(){let html='';const groups=[['characters','CHARACTERS',story.characters],['events','EVENTS',C.sortedEvents(story)]];for(const [type,title,items] of groups){if(filter!=='all'&&filter!==type)continue;const list=items.filter(n=>(C.label(n)+' '+(n.narrative||n.description||'')).toLowerCase().includes(query));html+=`<div class="library-section-title"><span>${title}</span><span>${list.length.toString().padStart(2,'0')}</span></div>`;html+=list.map(n=>`<button class="library-item ${selected===n.id?'selected':''}" data-select="${n.id}" data-focus="true">${n.title?`<span class="mini-note">${n.role==='beginning'?'↗':n.role==='ending'?'◈':'◇'}</span>`:`<span class="mini-avatar"><img src="${n.portrait||X.avatar(n)}" alt=""></span>`}<span><strong>${esc(C.label(n))}</strong><small>${n.title?`${esc(n.role)} · ${n.begin}–${n.end}`:n.importance+' · '+(n.named?'named':'unnamed')}</small></span></button>`).join('');if(!list.length)html+='<p class="form-hint" style="padding:5px">No matching items.</p>';}
 $('#library-items').innerHTML=html;
}
function renderRoute(){if(story.medium!=='game'){$('#routebar').innerHTML='<span class="route-active">LINEAR STORY</span><span class="route-caption">Every event and connection is static.</span><button class="text-button" data-action="add-character">＋ Character</button><button class="text-button" data-action="add-event">＋ Event</button>';return;}
 const branch=C.branches(story);const p=C.preview(story,selections,previewEnabled,time);const activeEnds=story.events.filter(e=>e.role==='ending'&&p.active.has(e.id)).length;$('#routebar').innerHTML=`<label><input id="preview-toggle" type="checkbox" ${previewEnabled?'checked':''}> Branch preview</label>${previewEnabled?branch.map(b=>`<label title="${esc(b.event.title)}" style="opacity:${p.active.has(b.event.id)?1:.45}"><select data-choice="${b.event.id}" aria-label="Choice at ${esc(b.event.title)}"><option value="">${esc(b.event.title)}: undecided</option>${b.choices.map(l=>`<option value="${l.id}" ${selections[b.event.id]===l.id?'selected':''}>${esc(l.label)}</option>`).join('')}</select></label>`).join('')||'<span class="route-caption">Add dynamic event connections to create choices.</span>':'<span class="route-caption">All possibilities, one connected story.</span>'}${previewEnabled?`<span class="route-caption" title="Active ending events for the selected route">${activeEnds===1?'1 ending':activeEnds+' endings · review choices'}</span>`:''}<button class="text-button" data-action="add-character" title="Add character">＋ Character</button><button class="text-button" data-action="add-event" title="Add event">＋ Event</button>`;
}
function renderBoard(){const p=C.preview(story,selections,previewEnabled,time);$('#cards').innerHTML=story.characters.map(c=>`<article tabindex="0" role="button" aria-label="${esc(C.label(c))}, ${c.importance} character" data-node="${c.id}" class="board-card character-card ${selected===c.id?'selected':''} ${p.characters[c.id].present?'':'inactive'}" style="left:${c.x}px;top:${c.y}px"><span class="pin"></span><div class="card-portrait"><img src="${c.portrait||X.avatar(c)}" alt="${c.portrait?'Portrait of '+esc(C.label(c)):'Default portrait placeholder'}"><span class="portrait-tag">${c.importance.toUpperCase()} CHARACTER</span></div><h3>${esc(C.label(c))}</h3><div class="role">${esc(c.archetype||'Character record')}</div><div class="card-footer"><span>${c.named?'NAMED':'UNNAMED'}</span><span>${story.connections.filter(l=>l.from===c.id||l.to===c.id).length} THREADS</span></div></article>`).join('')+story.events.map(e=>`<article tabindex="0" role="button" aria-label="${esc(e.title)}, ${e.behavior} ${e.role}" data-node="${e.id}" class="board-card event-card ${e.behavior} ${selected===e.id?'selected':''} ${p.active.has(e.id)?'':'inactive'}" style="left:${e.x}px;top:${e.y}px"><span class="pin"></span><div class="event-meta"><span>${e.role.toUpperCase()}</span><span>${e.behavior==='dynamic'?'◇':'●'}</span></div><h3>${esc(e.title)}</h3><p>${esc(e.description)}</p><div class="event-time"><span>${esc(story.unit.toUpperCase())} ${e.begin} — ${e.end}</span><span>${e.behavior==='static'?'ALWAYS':'CONDITIONAL'}</span></div></article>`).join('');renderThreads(p);}
function renderThreads(p=C.preview(story,selections,previewEnabled,time)){$('#threads').innerHTML='<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>'+story.connections.map(l=>{const a=C.getNode(story,l.from),b=C.getNode(story,l.to);if(!a||!b)return '';const x=a.x+(a.title?97:87),y=a.y+4,u=b.x+(b.title?97:87),v=b.y+4,mid=(y+v)/2+55,path=`M ${x} ${y} Q ${(x+u)/2} ${mid} ${u} ${v}`;return `<g class="thread-group ${p.connectionActive(l)?'':'inactive'}" data-link="${l.id}" tabindex="0" role="button" aria-label="Edit connection: ${esc(l.label||'Connected')}"><path class="thread-hit" d="${path}"/><path class="thread-line" pointer-events="none" stroke="${C.color(story,l)}" d="${path}" ${a.title&&b.title?'marker-end="url(#arrow)"':''}/><text class="thread-label" x="${(x+u)/2}" y="${(y+v)/2+29}">${esc(l.label)}</text></g>`;}).join('');}
function renderTimeline(){const max=maxTime(),p=C.preview(story,selections,previewEnabled,Infinity),at=C.preview(story,selections,previewEnabled,time);let html='<div class="timeline-ruler"><div class="track-label">CHARACTERS & EVENTS</div><div class="track" data-ruler="true">'+Array.from({length:11},(_,i)=>`<span class="tick" style="left:${i*10}%">${+(max*i/10).toFixed(1)}</span>`).join('')+'</div></div>';
 for(const e of C.sortedEvents(story))html+=`<div class="timeline-row"><button class="track-label text-button" data-select="${e.id}">${esc(e.title)}</button><div class="track"><button class="time-block ${e.behavior} ${selected===e.id?'selected':''} ${p.active.has(e.id)?'':'inactive'}" data-time-event="${e.id}" title="${esc(e.title)} · ${e.begin}–${e.end}. Drag to move in time." style="left:${e.begin/max*100}%;width:${Math.max(.5,(e.end-e.begin)/max*100)}%">${esc(e.title)}</button><span class="playhead-line" style="left:${time/max*100}%"></span></div></div>`;
 for(const c of story.characters){const info=p.characters[c.id],end=Math.min(max,info.end);html+=`<div class="timeline-row"><button class="track-label text-button" data-select="${c.id}">${esc(C.label(c))}</button><div class="track"><button class="time-block character ${selected===c.id?'selected':''} ${info.present?'':'inactive'}" data-select="${c.id}" title="${esc(C.label(c))} · ${info.begin}–${Number.isFinite(info.end)?info.end:'ongoing'}" style="left:${info.begin/max*100}%;width:${Math.max(.4,(end-info.begin)/max*100)}%">${esc(C.label(c))}${Number.isFinite(info.end)?' · exit':''}</button>${c.dynamicTraits.map(t=>{const e=C.getNode(story,t.eventId);return e?`<button class="trait-mark ${t.effect==='exit'?'exit':''}" data-select="${c.id}" title="${esc(t.key+': '+t.value)} at ${e.begin}" style="left:${e.begin/max*100}%;opacity:${!previewEnabled||at.characters[c.id].triggered.some(x=>x.id===t.id)?1:.2};padding:0;border-radius:0"></button>`:'';}).join('')}<span class="playhead-line" style="left:${time/max*100}%"></span></div></div>`;}

function renderInspector(){const n=current(),panel=$('#inspector');if(!n){panel.innerHTML=`<div class="inspector-head"><span>THE STORY SO FAR</span><button data-action="close-inspector">×</button></div><div class="empty-inspector"><div class="emblem">⌁</div><h2>Every character<br>needs a reason.</h2><p>Select a photograph, event, or thread to inspect the story behind it.</p><p>${esc(story.description)}</p><button data-action="add-character" class="primary">Create a character</button></div><div class="field-section"><h3>YOUR WORKSPACE</h3><p>${story.characters.length} characters · ${story.events.length} events<br>${story.connections.length} connections</p><button data-action="settings">Story settings</button></div>`;return;}

function modal(title,subtitle,body,footer,submit){$('#modal-content').innerHTML=`<div class="modal-head"><div><span class="small-caps">THE WEBS WE WEAVE</span><h2>${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div><button data-action="close-modal" aria-label="Close dialog">×</button></div><form id="modal-form"><div class="modal-body"><div id="form-error" class="form-error" role="alert"></div>${body}</div><div class="modal-foot">${footer||'<button type="button" data-action="close-modal">Cancel</button><button type="submit" class="primary">Save changes</button>'}</div></form>`;modalSubmit=submit;$('#modal-form').onsubmit=async e=>{e.preventDefault();try{await modalSubmit?.(new FormData(e.currentTarget));}catch(err){error(err.message);}};if(!$('#modal').open)$('#modal').showModal();$('#modal').scrollTop=0;}

function traitForm(t={}){return `<div class="dynamic-trait-form" data-trait-id="${t.id||C.uid('t')}"><div class="form-grid">${input('Trait / state name','trait-key',t.key||'',true)}${input('Value / consequence','trait-value',t.value||'',true)}</div><div class="form-grid"><label>Starts at event<select name="trait-event">${eventOptions(t.eventId)}</select></label><label>Required choice<select name="trait-choice">${choiceOptions(t.choiceId)}</select></label></div><div class="form-grid"><label>Effect<select name="trait-effect"><option value="trait" ${t.effect!=='exit'?'selected':''}>Change a trait</option><option value="exit" ${t.effect==='exit'?'selected':''}>Permanent exit at event end</option></select></label><label>Narrative importance<select name="trait-importance">${['low','normal','high'].map(v=>`<option value="${v}" ${v===(t.importance||'normal')?'selected':''}>${v}</option>`).join('')}</select></label></div><button type="button" class="remove-trait danger">Remove trait</button></div>`;}
function characterModal(c){const edit=!!c;c=c||{named:true,importance:'minor',name:'',archetype:'',justification:'',narrative:'',personality:'',staticTraits:[],dynamicTraits:[],entrance:{eventId:story.events.find(e=>e.role==='beginning').id,why:'',how:''},exit:null,portrait:''};portraitValue=c.portrait;
 modal(edit?'Edit character':'Create a character','Give this character a reason to exist.',`<div class="form-grid three"><label>Identity<select name="identity" id="identity"><option value="named" ${c.named?'selected':''}>Named</option><option value="unnamed" ${!c.named?'selected':''}>Unnamed</option></select></label><label>Importance<select name="importance" id="importance"><option value="minor" ${c.importance==='minor'?'selected':''}>Minor</option><option value="major" ${c.importance==='major'?'selected':''}>Major</option></select></label>${input('Proper name','name',c.name,c.named)}</div>${input('Archetype / short role','archetype',c.archetype,!c.named)}${textarea('Justification','justification',c.justification,true,'One concise reason this character belongs in the story.')}${textarea('Narrative description','narrative',c.narrative,true,'One high-level description for the entire character.')}${textarea('Personality','personality',c.personality)}${textarea('Static traits','staticTraits',c.staticTraits.join('\n'),true,'One trait per line. These are true on every route where the character appears.')}<hr class="form-divider"><div class="form-section-title">ENTRANCE <span class="required">REQUIRED</span></div><label>First appearance / when<select name="entranceEvent">${eventOptions(c.entrance.eventId)}</select><small>The timeline uses this event’s begin time.</small></label><div class="form-grid">${textarea('Why they enter','entranceWhy',c.entrance.why,true)}${textarea('How they enter','entranceHow',c.entrance.how,true)}</div><label class="check-label"><input id="has-exit" type="checkbox" name="hasExit" ${c.exit?'checked':''}> Define a permanent exit</label><div id="exit-fields" ${c.exit?'':'hidden'}><label>Exit event / when<select name="exitEvent">${eventOptions(c.exit?.eventId||story.events.find(e=>e.role==='ending').id)}</select><small>The timeline uses this event’s end time. For a choice-dependent departure, add a dynamic exit trait.</small></label><div class="form-grid">${textarea('Why they exit','exitWhy',c.exit?.why||'')}${textarea('How they exit','exitHow',c.exit?.how||'')}</div></div>${story.medium==='game'?`<hr class="form-divider"><div class="form-section-title">DYNAMIC TRAITS <button type="button" data-action="add-trait">＋ Add trait</button></div><p class="form-hint">A trait takes effect from its event’s begin time when the required choice is selected. Later values with the same trait name replace earlier values in the preview.</p><div id="trait-forms">${c.dynamicTraits.map(traitForm).join('')}</div>`:''}<hr class="form-divider"><label>Portrait <span class="optional">/ placeholder supplied by default</span><img id="portrait-preview" class="portrait-preview" src="${c.portrait||X.avatar(c.id?c:{id:'new'})}" alt="Portrait preview"><input id="portrait-input" type="file" accept="image/png,image/jpeg,image/webp"><small>PNG, JPEG or WebP, up to 15 MB. Resized and embedded in the project.</small></label><button type="button" data-action="clear-portrait">Use placeholder</button>`,null,async fd=>{
   const named=fd.get('identity')==='named',hasExit=fd.has('hasExit');const n={...c,id:c.id||C.uid('c'),named,name:named?String(fd.get('name')).trim():'',archetype:String(fd.get('archetype')).trim(),importance:named?fd.get('importance'):'minor',justification:fd.get('justification').trim(),narrative:fd.get('narrative').trim(),personality:fd.get('personality').trim(),staticTraits:fd.get('staticTraits').split('\n').map(t=>t.trim()).filter(Boolean),entrance:{eventId:fd.get('entranceEvent'),why:fd.get('entranceWhy').trim(),how:fd.get('entranceHow').trim()},exit:hasExit?{eventId:fd.get('exitEvent'),why:fd.get('exitWhy').trim(),how:fd.get('exitHow').trim()}:null,portrait:portraitValue,dynamicTraits:$$('.dynamic-trait-form').map(el=>{const val=name=>el.querySelector(`[name="${name}"]`).value.trim();return{id:el.dataset.traitId,key:val('trait-key'),value:val('trait-value'),eventId:val('trait-event'),choiceId:val('trait-choice'),effect:val('trait-effect'),importance:val('trait-importance')};}),x:c.x??(-view.x+120)/view.z,y:c.y??(-view.y+70)/view.z};
   if(!named&&!n.archetype)throw new Error('Give an unnamed character an archetype or short role.');
   const candidate=C.clone(story);if(edit)candidate.characters[candidate.characters.findIndex(x=>x.id===n.id)]=n;else candidate.characters.push(n);
   for(const moment of [n.entrance,n.exit].filter(Boolean)){if(!candidate.connections.some(l=>(l.from===n.id&&l.to===moment.eventId)||(l.to===n.id&&l.from===moment.eventId)))candidate.connections.push({id:C.uid('l'),from:n.id,to:moment.eventId,kind:C.getNode(candidate,moment.eventId).behavior==='dynamic'?'dynamic':'static',label:moment===n.entrance?'First appearance':'Permanent exit'});}
   const errors=C.validate(candidate).filter(i=>i.level==='error');if(errors.length)throw new Error(errors.map(i=>i.message).join(' '));commit();story=candidate;selected=n.id;changed();closeModal();toast(edit?'Character updated.':'Character created and connected to their entrance.');
 });updateIdentity();}
function updateIdentity(){const named=$('#identity').value==='named';const name=$('[name=name]'),role=$('[name=archetype]'),importance=$('#importance');name.required=named;name.disabled=!named;role.required=!named;importance.disabled=!named;if(!named)importance.value='minor';}
function eventModal(e){const edit=!!e;e=e||{title:'',description:'',role:'event',behavior:'static',begin:Math.round(maxTime()/2),end:Math.round(maxTime()/2)+1};const fixed=e.role==='beginning',linear=story.medium!=='game';modal(edit?'Edit event':'Add an event','Events give character appearances a place in story time.',`${input('Event title','title',e.title,true)}${textarea('Description','description',e.description)}<div class="form-grid"><label>Role<select name="role" ${fixed?'disabled':''}><option value="event" ${e.role==='event'?'selected':''}>Event</option><option value="ending" ${e.role==='ending'?'selected':''} ${linear&&!edit?'disabled':''}>Ending</option>${fixed?'<option value="beginning" selected>Beginning</option>':''}</select></label><label>Occurrence<select name="behavior" ${fixed||linear?'disabled':''}><option value="static" ${e.behavior==='static'?'selected':''}>Static · happens on every route</option><option value="dynamic" ${e.behavior==='dynamic'?'selected':''}>Dynamic · depends on a route</option></select></label></div><div class="form-grid">${input('Begin ('+esc(story.unit)+')','begin',e.begin,true,'number')}${input('End ('+esc(story.unit)+')','end',e.end,true,'number')}</div><p class="info-callout">Static events occur regardless of player choices. A dynamic event occurs when an active incoming connection reaches it. The beginning is unique and always static.</p>`,null,fd=>{
 const n={...e,id:e.id||C.uid('e'),title:fd.get('title').trim(),description:fd.get('description').trim(),role:fixed?'beginning':fd.get('role'),behavior:fixed||linear?'static':fd.get('behavior'),begin:Number(fd.get('begin')),end:Number(fd.get('end')),x:e.x??(-view.x+180)/view.z,y:e.y??(-view.y+180)/view.z};const candidate=C.clone(story);if(edit)candidate.events[candidate.events.findIndex(x=>x.id===n.id)]=n;else candidate.events.push(n);const errors=C.validate(candidate).filter(i=>i.level==='error');if(errors.length)throw new Error(errors.map(i=>i.message).join(' '));commit();story=candidate;selected=n.id;changed();closeModal();toast('Event saved. Character chronology updated.');});}
function connectionModal(link,from,to){const edit=!!link,linear=story.medium!=='game';link=link||{id:C.uid('l'),from:from||selected||story.events[0].id,to:to||C.nodes(story).find(n=>n.id!==(from||selected))?.id,kind:'static',label:'',choiceId:''};const options=id=>C.nodes(story).map(n=>`<option value="${n.id}" ${n.id===id?'selected':''}>${n.title?'EVENT':'CHARACTER'} · ${esc(C.label(n))}</option>`).join('');modal(edit?'Edit a thread':'Connect the story','Direction matters for event-to-event connections.',`<div class="form-grid"><label>From<select name="from">${options(link.from)}</select></label><label>To<select name="to">${options(link.to)}</select></label></div><label>Connection type<select name="kind" ${linear?'disabled':''}><option value="static" ${link.kind==='static'?'selected':''}>Static · red thread</option><option value="dynamic" ${link.kind==='dynamic'?'selected':''}>Dynamic · conditional thread</option></select></label>${input('Relationship / choice label','label',link.label)}${!linear?`<label>Required choice <span class="optional">/ for character relationships</span><select name="choiceId">${choiceOptions(link.choiceId)}</select><small>Event-to-event dynamic links are choices themselves. Choices sharing a source event are mutually exclusive.</small></label><label class="check-label"><input type="checkbox" name="conditionalTarget" ${!edit?'checked':''}> When adding a dynamic event route, make its destination dynamic</label>`:''}<p class="form-hint">Static threads are red. Dynamic thread colors are assigned by source chronology. Static links continue from every reached event; selecting a dynamic choice adds that route.</p>`,`${edit?'<button type="button" class="danger" data-delete-link="'+link.id+'">Delete thread</button>':''}<button type="button" data-action="close-modal">Cancel</button><button class="primary" type="submit">${edit?'Update':'Connect'}</button>`,fd=>{const n={id:link.id,from:fd.get('from'),to:fd.get('to'),kind:linear?'static':fd.get('kind'),label:fd.get('label').trim(),choiceId:fd.get('choiceId')||''};if(n.from===n.to)throw new Error('Choose two different items.');const bothEvents=C.isEvent(story,n.from)&&C.isEvent(story,n.to);if(bothEvents||n.kind==='static')n.choiceId='';if(n.kind==='dynamic'&&!n.label)throw new Error('Give this choice or conditional relationship a label.');if(story.connections.some(l=>l.id!==n.id&&l.from===n.from&&l.to===n.to&&l.kind===n.kind&&l.label===n.label))throw new Error('That connection already exists.');const candidate=C.clone(story);if(edit)candidate.connections[candidate.connections.findIndex(l=>l.id===n.id)]=n;else candidate.connections.push(n);if(bothEvents&&n.kind==='dynamic'&&fd.has('conditionalTarget')&&C.getNode(candidate,n.to).role!=='beginning')C.getNode(candidate,n.to).behavior='dynamic';const errors=C.validate(candidate).filter(i=>i.level==='error');if(errors.length)throw new Error(errors.map(i=>i.message).join(' '));commit();story=candidate;connect=false;connectSource=null;changed();closeModal();toast('Thread saved.');});}
function settingsModal(){modal('Story settings','Your story is the project that contains every record.',`${input('Story title','title',story.title,true)}${textarea('Story synopsis','description',story.description)}${input('Timeline unit','unit',story.unit,true)}<p class="form-hint">Examples: beat, scene, chapter, day, minute. Times are numeric and may include decimals.</p><div class="info-callout">Medium: ${mediumName(story.medium)}. Create a new story to select a different medium and its branching rules.</div>`,null,fd=>{if(!fd.get('title').trim()||!fd.get('unit').trim())throw new Error('A story title and timeline unit are required.');mutate(()=>{story.title=fd.get('title').trim();story.description=fd.get('description').trim();story.unit=fd.get('unit').trim().slice(0,40);});closeModal();});}
function newModal(){modal('Where does your story begin?','Choose your medium. TW3 adapts its character and event rules.',`${input('Story title','title','Untitled story',true)}<div class="start-options">${[['game','Video game'],['novel','Novel'],['film','Film'],['tv','Television']].map(([v,l])=>`<label class="medium-option"><input type="radio" name="medium" value="${v}" ${v==='game'?'checked':''}>${l}</label>`).join('')}</div>${input('Timeline unit','unit','beat',true)}<p class="info-callout">Video games support choices, dynamic traits, and alternate endings. Novels, films, and television use a single, static storyline.</p>${dirty?'<p class="form-hint">The current draft has changes not saved to a project file. Save it before replacing this workspace.</p>':''}`,`<button type="button" data-action="save-before-new">Save current project</button><button type="button" data-action="close-modal">Cancel</button><button type="submit" class="primary">Create story</button>`,fd=>{const next=C.blank(fd.get('title').trim(),fd.get('medium'),fd.get('unit').trim().slice(0,40));const invalid=C.validate(next).filter(i=>i.level==='error');if(invalid.length)throw new Error(invalid[0].message);load(next,false);dirty=true;recover();closeModal();toast('Story created with one beginning and one ending.');});}
function healthModal(){const issues=C.validate(story);modal('Story checks',issues.length?`${issues.length} item${issues.length===1?'':'s'} to review.`:'Every required story rule is satisfied.',`<p class="form-hint">Checks cover required fields, identity rules, event references, chronology, graph loops, disconnected events, and routes without an ending. Warnings may be intentional; review them in context.</p>${issues.map(i=>`<button type="button" class="issue ${i.level}" ${i.nodeId?`data-issue-node="${i.nodeId}"`:''}><small>${i.level}</small>${esc(i.message)}</button>`).join('')||'<p class="info-callout">No issues found. Your characters have reasons to exist, entrances, static traits, and event connections.</p>'}`, '<button type="button" data-action="close-modal" class="primary">Back to the board</button>');}
function exportModal(single=false){const n=current();modal('Export your story','Portable records. No account, connection, or upload required.',`<label>PDF / JSON scope<select id="export-scope"><option value="">Entire story</option>${C.nodes(story).map(x=>`<option value="${x.id}" ${single&&n?.id===x.id?'selected':''}>${esc(C.label(x))}</option>`).join('')}</select></label><label>Image contents<select id="image-scope"><option value="board">Evidence board</option><option value="timeline">Story timeline</option><option value="both">Board + timeline</option></select></label><div class="export-grid"><button type="button" class="export-option" data-export="pdf"><span class="export-icon">Aa</span><span><strong>PDF report</strong><small>Board, timeline, and complete records</small></span></button><button type="button" class="export-option" data-export="png"><span class="export-icon">▧</span><span><strong>PNG image</strong><small>High-resolution visual snapshot</small></span></button><button type="button" class="export-option" data-export="html"><span class="export-icon">⌁</span><span><strong>Interactive HTML</strong><small>Pan, zoom, select, and read offline</small></span></button><button type="button" class="export-option" data-export="json"><span class="export-icon">{ }</span><span><strong>JSON text</strong><small>Structured story or selected record</small></span></button></div><p class="form-hint">Visual exports include every route. HTML always contains the entire story. A selected record’s PDF contains its complete text summary and relationships. PDF text is rendered as images for consistent offline fonts; use JSON for searchable text. Save/Open uses complete .tw3 project files.</p>`, '<button type="button" data-action="close-modal">Close</button>');}
async function doExport(kind){const scope=$('#export-scope').value,which=$('#image-scope').value,n=C.getNode(story,scope),base=X.slug(story.title)+(n?'-'+X.slug(C.label(n)):'');$$('[data-export]').forEach(b=>b.disabled=true);toast('Preparing '+kind.toUpperCase()+' export…');try{let blob,name;if(kind==='pdf'){blob=await X.pdf(story,scope);name=base+'.pdf';}if(kind==='png'){blob=await X.png(story,which);name=X.slug(story.title)+'-'+which+'.png';}if(kind==='html'){blob=await X.html(story);name=X.slug(story.title)+'-interactive.html';}if(kind==='json'){const data=n?{format:'tw3-record',version:1,storyTitle:story.title,type:n.title?'event':'character',record:n,connections:story.connections.filter(l=>l.from===n.id||l.to===n.id),summary:X.record(story,n)}:story;blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});name=base+'.json';}X.download(blob,name);toast('Export ready: '+name);}catch(e){toast('Export failed: '+e.message);}finally{$$('[data-export]').forEach(b=>b.disabled=false);}}
async function save(as=false){const data=JSON.stringify(story,null,2),name=X.slug(story.title)+'.tw3';try{if('showSaveFilePicker'in window && window.isSecureContext){if(as||!fileHandle)fileHandle=await window.showSaveFilePicker({suggestedName:name,types:[{description:'TW3 story project',accept:{'application/json':['.tw3','.json']}}]});const writable=await fileHandle.createWritable();await writable.write(data);await writable.close();dirty=false;toast('Project saved.');}else{X.download(new Blob([data],{type:'application/json'}),name);dirty=false;toast('Project downloaded. Keep the .tw3 file as your backup.');}recover();status();return true;}catch(e){if(e.name==='AbortError')return false;if(['SecurityError','NotAllowedError','NotSupportedError'].includes(e.name)){fileHandle=null;X.download(new Blob([data],{type:'application/json'}),name);dirty=false;recover();toast('Direct file access is unavailable here. Downloaded a project copy instead.');return true;}toast('Could not save: '+e.message);return false;}}
function load(s,fromDisk){story=s;selected=s.characters[0]?.id||s.events[0]?.id;history=[];future=[];selections={};previewEnabled=false;time=0;fileHandle=null;dirty=!fromDisk;connect=false;connectSource=null;render();fit();recover();}
function openFile(){if(dirty){modal('Open another story?','The current draft has changes not saved to a project file.','<p class="form-hint">Save your current project first if you need to keep it. Opening another project replaces the browser recovery draft.</p>','<button type="button" data-action="save-before-open">Save current project</button><button type="button" data-action="close-modal">Cancel</button><button type="button" class="primary" data-action="open-anyway">Choose project</button>');}else $('#project-input').click();}
function deleteLink(id){const referenced=story.characters.some(c=>c.dynamicTraits.some(t=>t.choiceId===id))||story.connections.some(l=>l.choiceId===id);if(referenced){error('This choice is used by a dynamic trait or relationship. Update those conditions before deleting it.');return;}const candidate=C.clone(story);candidate.connections=candidate.connections.filter(l=>l.id!==id);const errors=C.validate(candidate).filter(i=>i.level==='error');if(errors.length){error(errors.map(i=>i.message).join(' '));return;}commit();story=candidate;changed();closeModal();toast('Thread removed. Undo is available.');}
function deleteNode(){const n=current();if(!n)return;if(n.role==='beginning'){toast('The single beginning cannot be deleted. Edit it instead.');return;}if(n.role==='ending'&&story.events.filter(e=>e.role==='ending').length===1){toast('A story must retain at least one ending.');return;}if(n.title&&story.characters.some(c=>c.entrance.eventId===n.id||c.exit?.eventId===n.id||c.dynamicTraits.some(t=>t.eventId===n.id))){toast('This event defines a character entrance, exit, or trait. Update those references before deleting it.');return;}const linked=story.connections.filter(l=>l.from===n.id||l.to===n.id).map(l=>l.id);if(story.characters.some(c=>c.dynamicTraits.some(t=>linked.includes(t.choiceId)))||story.connections.some(l=>!linked.includes(l.id)&&linked.includes(l.choiceId))){toast('A connected choice is used by a trait or relationship. Update its conditions first.');return;}modal('Delete '+C.label(n)+'?','This also removes every thread attached to it.',`<p class="form-hint">You can undo this deletion while the project remains open.</p>`,'<button type="button" data-action="close-modal">Cancel</button><button type="submit" class="danger">Delete item</button>',()=>{mutate(()=>{story.characters=story.characters.filter(c=>c.id!==n.id);story.events=story.events.filter(e=>e.id!==n.id);story.connections=story.connections.filter(l=>l.from!==n.id&&l.to!==n.id);selected=null;});closeModal();toast('Item deleted. Undo is available.');});}
function help(){modal('A guide to weaving stories','TW3 (“twee”) · Version '+C.VERSION,`<div class="help-text"><p>Build your cast around the work each character does for the story. The board describes relationships; the timeline shows when they matter.</p><h3>1. Start a project</h3><p>Use <b>New</b> to choose a video game, novel, film, or television story. Every project starts with exactly one beginning and an ending. Select the story title to edit its synopsis or timeline unit.</p><h3>2. Create characters and events</h3><p>A character needs one justification, one narrative description, an entrance with why and how, and at least one static trait. Unnamed characters are always minor. A placeholder portrait is provided. Entrance and exit events are connected automatically.</p><h3>3. Draw the threads</h3><p>Choose <b>Connect</b>, then click two cards, or use “Connect this character/event” in the inspector. Threads can connect any two different items. Event threads are directional. Click a thread to edit it. Static threads are red; conditional colors follow the source’s chronology.</p><h3>4. Explore choices</h3><p>In games, add dynamic event-to-event links with choice labels. All choices leaving the same event are mutually exclusive. Static outgoing links continue regardless of the choice. Static events always occur, even if disconnected; story checks flag disconnected events. Mark events dynamic when they should appear only on a selected route.</p><p>Turn on <b>Branch preview</b> and select choices. Unreached items fade. Dynamic traits begin at their trigger event after their required choice. Use the <b>At</b> time control or click the timeline ruler to inspect current state. A later value with the same trait name replaces the earlier value. Conditional exits end a character’s track at the trigger event’s end.</p><h3>5. Work in time</h3><p>Event begin/end values define chronology. Character tracks start at the entrance event’s begin time and end at the exit event’s end time. Drag event bars to move them in time; edit the event to change its duration. Diamond markers show trait changes. The timeline can be expanded or collapsed.</p><h3>6. Keep and share</h3><p><b>Save</b> keeps the whole project as a .tw3 JSON file, including portraits. <b>Save As</b> chooses a new file. Browsers without direct file access download a new copy for each save. <b>Open</b> reads .tw3 or whole-story JSON. Browser recovery is a convenience, not a backup.</p><p>Export the whole story or one record to PDF or JSON; export board/timeline PNGs; or share an interactive HTML snapshot. HTML snapshots are read-only and include a project download. PDF pages preserve typography as images; JSON retains editable text. Every export is produced locally.</p><h3>Shortcuts</h3><p><kbd>Ctrl / ⌘ S</kbd> Save &nbsp; <kbd>Ctrl / ⌘ Shift S</kbd> Save As<br><kbd>Ctrl / ⌘ Z</kbd> Undo &nbsp; <kbd>Ctrl / ⌘ Shift Z</kbd> Redo<br><kbd>F</kbd> Fit board &nbsp; <kbd>C</kbd> Connect &nbsp; <kbd>Esc</kbd> Cancel connection<br><kbd>Enter</kbd> selects a focused card or thread. Drag empty board space to pan. Use the mouse wheel or zoom buttons to zoom.</p><h3>Boundaries of this version</h3><p>Choices are explicit, exclusive routes from an event. Conditions can require one selected choice, and a trigger event provides additional route context. This version has no arbitrary scripting, multiplayer collaboration, or cloud synchronization. Import limits: 500 characters, 500 events, 3,000 connections, and 40 MB per project. Large projects may be slower in the browser.</p></div>`, '<button type="button" data-action="close-modal" class="primary">Back to the story</button>');}
function about(){modal('The Webs We Weave','TW3 · pronounced “twee”',`<div class="help-text"><p style="font:25px Georgia;line-height:1.5">Every character leaves a thread.</p><p>A private, offline workspace for building characters around their narrative purpose, relationships, and the moments that change them.</p><p>Version ${C.VERSION}. No network requests, tracking, accounts, external fonts, or runtime dependencies. Your story stays on your device.</p><button type="button" data-action="help">Read the guide</button> <button type="button" data-action="sample">Open the example story</button></div>`,'<button type="button" data-action="close-modal">Close</button>');}
async function action(name){switch(name){
 case 'new':newModal();break;case 'open':openFile();break;case 'save':await save();break;case 'save-as':await save(true);break;case 'save-before-new':await save();break;case 'save-before-open':if(await save()){closeModal();$('#project-input').click();}break;case 'open-anyway':closeModal();$('#project-input').click();break;
 case 'export':exportModal();break;case 'export-selected':exportModal(true);break;case 'settings':settingsModal();break;case 'about':about();break;case 'help':help();break;case 'health':healthModal();break;case 'close-modal':closeModal();break;case 'close-inspector':selected=null;$('#inspector').classList.remove('mobile-open');render();break;
 case 'add-character':characterModal();break;case 'add-event':eventModal();break;case 'edit':if(current())current().title?eventModal(current()):characterModal(current());break;case 'delete':deleteNode();break;
 case 'connect':connect=!connect;connectSource=null;render();break;case 'connect-from':connectionModal(null,selected);break;case 'fit':fit();break;case 'zoom-in':zoom(1.2);break;case 'zoom-out':zoom(1/1.2);break;
 case 'undo':if(history.length){future.push(C.clone(story));story=history.pop();dirty=true;recover();render();}break;case 'redo':if(future.length){history.push(C.clone(story));story=future.pop();dirty=true;recover();render();}break;
 case 'arrange':mutate(()=>{story.characters.forEach((c,i)=>{c.x=90+(i%5)*245;c.y=70+Math.floor(i/5)*310;});const startY=story.characters.length?Math.ceil(story.characters.length/5)*310+100:120;C.sortedEvents(story).forEach((e,i)=>{e.x=90+(i%5)*260;e.y=startY+Math.floor(i/5)*260;});});fit();break;
 case 'add-trait':$('#trait-forms').insertAdjacentHTML('beforeend',traitForm());break;case 'clear-portrait':portraitValue='';$('#portrait-preview').src=X.avatar({id:'placeholder'});$('#portrait-input').value='';break;
 case 'timeline-toggle':{const el=$('#timeline');if(el.classList.contains('collapsed')){el.classList.remove('collapsed');el.classList.add('expanded');}else if(el.classList.contains('expanded')){el.classList.remove('expanded');}else el.classList.add('collapsed');break;}
 case 'sample':modal('Open the example story?','This replaces the current workspace.',`<p class="form-hint">Save your current project first if you want to keep it.</p>`,'<button type="button" data-action="save">Save current project</button><button type="button" data-action="close-modal">Cancel</button><button type="submit" class="primary">Open example</button>',()=>{load(C.sample(),false);closeModal();});break;
}}
function nodeClick(id){if(connect){if(!connectSource){connectSource=id;selected=id;render();}else if(id!==connectSource){connectionModal(null,connectSource,id);}}else select(id);}
document.addEventListener('click',e=>{const actionEl=e.target.closest('[data-action]');if(actionEl){if(actionEl.closest('form')&&actionEl.tagName==='BUTTON')e.preventDefault();action(actionEl.dataset.action);return;}const selection=e.target.closest('[data-select]');if(selection){select(selection.dataset.select,selection.dataset.focus==='true');return;}const timeBar=e.target.closest('[data-time-event]');if(timeBar){select(timeBar.dataset.timeEvent);return;}const editLink=e.target.closest('[data-edit-link]');if(editLink){connectionModal(story.connections.find(l=>l.id===editLink.dataset.editLink));return;}const deleteEl=e.target.closest('[data-delete-link]');if(deleteEl){deleteLink(deleteEl.dataset.deleteLink);return;}const issue=e.target.closest('[data-issue-node]');if(issue){closeModal();select(issue.dataset.issueNode,true);return;}const tab=e.target.closest('[data-filter]');if(tab){filter=tab.dataset.filter;$$('[data-filter]').forEach(t=>{t.classList.toggle('active',t===tab);t.setAttribute('aria-selected',t===tab?'true':'false');});renderLibrary();return;}const exp=e.target.closest('[data-export]');if(exp){doExport(exp.dataset.export);return;}if(e.target.closest('.remove-trait'))e.target.closest('.dynamic-trait-form').remove();});
document.addEventListener('change',async e=>{if(e.target.id==='preview-toggle'){previewEnabled=e.target.checked;render();}if(e.target.dataset.choice){selections[e.target.dataset.choice]=e.target.value;render();}if(e.target.id==='identity')updateIdentity();if(e.target.id==='has-exit')$('#exit-fields').hidden=!e.target.checked;if(e.target.id==='playhead'){time=Math.max(0,Math.min(maxTime(),Number(e.target.value)||0));renderTimeline();renderInspector();}if(e.target.id==='portrait-input'){const file=e.target.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>15*1024*1024){error('Choose a PNG, JPEG, or WebP under 15 MB.');e.target.value='';return;}const submit=$('#modal-form button[type=submit]');submit.disabled=true;try{const bitmap=await createImageBitmap(file);const scale=Math.min(1,600/Math.max(bitmap.width,bitmap.height));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bitmap.width*scale));cv.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=cv.getContext('2d');ctx.fillStyle='#d9decf';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(bitmap,0,0,cv.width,cv.height);bitmap.close();portraitValue=cv.toDataURL('image/jpeg',.86);$('#portrait-preview').src=portraitValue;}catch{error('Could not read that image. Try another portrait.');}finally{submit.disabled=false;}}});
$('#playhead').addEventListener('input',e=>{time=Math.max(0,Math.min(maxTime(),Number(e.target.value)||0));renderTimeline();renderInspector();});
$('#search').addEventListener('input',e=>{query=e.target.value.toLowerCase();renderLibrary();});
$('#project-input').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>40*1024*1024)throw new Error('The project exceeds the 40 MB import limit.');const parsed=C.parseProject(await file.text());load(parsed,true);toast('Opened '+parsed.title+'.');}catch(err){toast(err.message);}finally{e.target.value='';}});
$('#board').addEventListener('dragstart',e=>e.preventDefault());
$('#board').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.zoom-control'))return;const node=e.target.closest('[data-node]'),link=e.target.closest('[data-link]');if(link){drag={type:'link',id:link.dataset.link};return;}const b=$('#board');b.setPointerCapture(e.pointerId);if(node){e.preventDefault();const n=C.getNode(story,node.dataset.node);drag={type:'node',id:n.id,sx:e.clientX,sy:e.clientY,x:n.x,y:n.y,moved:false,before:null};}else drag={type:'pan',sx:e.clientX,sy:e.clientY,x:view.x,y:view.y,moved:false};});
$('#board').addEventListener('pointermove',e=>{if(!drag||drag.type==='link')return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(drag.type==='pan'){view.x=drag.x+dx;view.y=drag.y+dy;transform();}else if(drag.moved&&!connect){if(!drag.before)drag.before=C.clone(story);const n=C.getNode(story,drag.id);n.x=Math.round(drag.x+dx/view.z);n.y=Math.round(drag.y+dy/view.z);const el=$(`[data-node="${n.id}"]`);el.style.left=n.x+'px';el.style.top=n.y+'px';renderThreads();}});
$('#board').addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(d.type==='link'){connectionModal(story.connections.find(l=>l.id===d.id));return;}if(d.type==='node'){if(d.before){commit(d.before);selected=d.id;changed();}else nodeClick(d.id);}else if(!d.moved){selected=null;render();}});
$('#board').addEventListener('pointercancel',()=>{if(drag?.before){story=drag.before;render();}drag=null;});
$('#board').addEventListener('wheel',e=>{e.preventDefault();const rect=$('#board').getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,z=Math.min(2,Math.max(.15,view.z*Math.exp(-e.deltaY*.001)));view.x=x-(x-view.x)*z/view.z;view.y=y-(y-view.y)*z/view.z;view.z=z;transform();},{passive:false});
let timeDrag=null;
$('#timeline-content').addEventListener('pointerdown',e=>{const bar=e.target.closest('[data-time-event]');if(bar){e.preventDefault();const n=C.getNode(story,bar.dataset.timeEvent),track=bar.parentElement;timeDrag={id:n.id,sx:e.clientX,begin:n.begin,end:n.end,width:track.clientWidth,max:maxTime(),before:C.clone(story),bar,moved:false};bar.setPointerCapture(e.pointerId);}else if(e.target.closest('[data-ruler]')){const rect=e.target.closest('[data-ruler]').getBoundingClientRect();time=Math.round(Math.max(0,Math.min(maxTime(),(e.clientX-rect.left)/rect.width*maxTime()))*2)/2;$('#playhead').value=time;renderTimeline();renderInspector();}});
$('#timeline-content').addEventListener('pointermove',e=>{if(!timeDrag)return;const d=timeDrag,dx=e.clientX-d.sx;if(Math.abs(dx)<4&&!d.moved)return;d.moved=true;const n=C.getNode(story,d.id),delta=Math.round(dx/d.width*d.max*2)/2;n.begin=Math.max(0,d.begin+delta);n.end=n.begin+(d.end-d.begin);d.bar.style.left=n.begin/d.max*100+'%';});
$('#timeline-content').addEventListener('pointerup',()=>{if(!timeDrag)return;const d=timeDrag;timeDrag=null;selected=d.id;if(d.moved){const errors=C.validate(story).filter(i=>i.level==='error');if(errors.length){story=d.before;render();toast(errors[0].message);}else{commit(d.before);changed();}}else select(d.id);});
$('#timeline-content').addEventListener('pointercancel',()=>{if(timeDrag){story=timeDrag.before;timeDrag=null;render();}});
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save(e.shiftKey);return;}if($('#modal').open)return;if(!typing&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();action(e.shiftKey?'redo':'undo');}if(!typing&&e.key==='f')fit();if(!typing&&e.key==='c')action('connect');if(e.key==='Escape'){connect=false;connectSource=null;$('#inspector').classList.remove('mobile-open');render();}if(e.key==='Enter'&&!typing){const n=e.target.closest('[data-node]'),l=e.target.closest('[data-link]');if(n){e.preventDefault();nodeClick(n.dataset.node);}if(l){e.preventDefault();connectionModal(story.connections.find(x=>x.id===l.dataset.link));}}});
window.addEventListener('beforeunload',e=>{if(dirty){recover();e.preventDefault();e.returnValue='';}});
render();requestAnimationFrame(fit);window.addEventListener('resize',()=>transform());if(hydrated)setTimeout(()=>toast('Recovered your browser draft. Save a project file to keep a backup.'),400);else setTimeout(()=>toast('Explore the example, or choose New to begin your own story.'),500);
// Exposed read-only diagnostic snapshot for tests and user debugging.
Object.defineProperty(window,'TW3',{value:Object.freeze({version:C.VERSION,getProject:()=>C.clone(story),checks:()=>C.validate(story)})});
})();
