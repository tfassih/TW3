<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Webs We Weave — an offline character and narrative workspace.">
<meta name="theme-color" content="#202626"><title>TW3 · The Webs We Weave</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='14' width='64' height='64' fill='%23202626'/%3E%3Cpath d='M12 18L32 49 52 18M12 18L52 18M32 49L32 8' stroke='%23e0b875' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
<header class="topbar">
  <button class="brand" data-action="about" title="About The Webs We Weave"><span class="brand-mark">w<span>3</span></span><span class="brand-word">THE WEBS<br>WE WEAVE</span></button>
  <div class="story-heading"><button id="story-title" data-action="settings"></button><span id="story-meta"></span></div>
  <div class="header-actions"><span id="save-status" role="status"></span><button data-action="new">New</button><button data-action="open">Open</button><div class="save-group"><button data-action="save" title="Save project (Ctrl/⌘ S)">Save</button><button data-action="save-as" title="Save as a new project file">As…</button></div><button class="primary" data-action="export">Export <span aria-hidden="true">↗</span></button></div>
</header>
<div class="workspace">
<aside class="library-panel">
  <div class="panel-heading"><span>STORY ELEMENTS</span><button class="icon-button" data-action="help" title="Guide and keyboard shortcuts">?</button></div>
  <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" placeholder="Find a character or event" aria-label="Find a character or event"></label>
  <div class="library-tabs" role="tablist"><button class="active" data-filter="all" role="tab" aria-selected="true">All</button><button data-filter="characters" role="tab" aria-selected="false">Cast</button><button data-filter="events" role="tab" aria-selected="false">Events</button></div>
  <div id="library-items"></div>
  <div class="sidebar-bottom"><button class="add-wide" data-action="add-character"><span>＋</span> New character</button><button class="add-wide secondary" data-action="add-event"><span>＋</span> New event</button><button id="health-button" class="health-button" data-action="health"></button><p class="local-note"><span class="status-dot"></span> Private by design · Works offline</p></div>
</aside>
<main class="main-panel">
  <div class="viewbar"><div class="view-title"><span class="small-caps">THE EVIDENCE BOARD</span><span id="board-count"></span></div><div class="view-actions"><button id="undo" data-action="undo" title="Undo (Ctrl/⌘ Z)">↶</button><button id="redo" data-action="redo" title="Redo (Ctrl/⌘ Shift Z)">↷</button><span class="divider"></span><button id="connect-toggle" data-action="connect" title="Connect two items">⌁ <span>Connect</span></button><button data-action="arrange" title="Arrange items by type and time">Arrange</button><button data-action="fit" title="Fit the board in view (F)">Fit</button></div></div>
  <div id="routebar" class="routebar"></div>
  <section id="board" tabindex="0" aria-label="Evidence board. Drag cards to move. Drag empty space to pan. Use the zoom controls.">
    <div class="board-watermark"><span>TW3</span><p>Every character leaves a thread.</p></div>
    <div id="world"><svg id="threads" xmlns="http://www.w3.org/2000/svg" aria-label="Story connections"></svg><div id="cards"></div></div>
    <div id="connection-hint" class="connection-hint" hidden></div>
    <div class="board-legend"><span><i class="thread red"></i>Always</span><span><i class="thread teal"></i>Conditional</span></div>
    <div class="zoom-control"><button data-action="zoom-out" aria-label="Zoom out">−</button><span id="zoom-label">100%</span><button data-action="zoom-in" aria-label="Zoom in">＋</button><button data-action="fit" aria-label="Fit board">⛶</button></div>
    <div class="board-hint">Drag to arrange · Scroll to zoom · Click a thread to edit</div>
  </section>
  <section id="timeline" class="timeline-panel" aria-label="Story timeline">
    <div class="timeline-heading"><div><span class="small-caps">STORY TIMELINE</span><span class="derived-label">Derived from your events</span></div><div class="timeline-tools"><label>At <input id="playhead" type="number" min="0" value="0" step="0.5" aria-label="Timeline preview time"></label><span id="timeline-unit"></span><button data-action="timeline-toggle" id="timeline-toggle" title="Expand or collapse timeline">⌄</button></div></div>
    <div id="timeline-scroll"><div id="timeline-content"></div></div>
  </section>
</main>
<aside id="inspector" class="inspector" aria-label="Selected item inspector"></aside>
</div>
</div>
<dialog id="modal"><div id="modal-content"></div></dialog>
<input id="project-input" type="file" accept=".tw3,.json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>TW3 needs JavaScript enabled. It runs entirely on your device.</noscript>
<script src="src/core.js"></script><script src="src/exports.js"></script><script src="src/app.js"></script>
</body>
</html>
